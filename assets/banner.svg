<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7AD3A" />
      <stop offset="50%" stop-color="#FE428E" />
      <stop offset="100%" stop-color="#00FFC4" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7AD3A" />
      <stop offset="50%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#00FFC4" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: url(#textGrad);
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: "Fira Code", monospace, "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #8b949e;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: "Fira Code", monospace, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #00FFC4;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.03);
      stroke-width: 1;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="136" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Decorative Grid Lines -->
  <line x1="0" y1="35" x2="850" y2="35" class="grid-line" />
  <line x1="0" y1="70" x2="850" y2="70" class="grid-line" />
  <line x1="0" y1="105" x2="850" y2="105" class="grid-line" />
  <line x1="170" y1="0" x2="170" y2="140" class="grid-line" />
  <line x1="340" y1="0" x2="340" y2="140" class="grid-line" />
  <line x1="510" y1="0" x2="510" y2="140" class="grid-line" />
  <line x1="680" y1="0" x2="680" y2="140" class="grid-line" />

  <!-- Corner Tech Accent Decals -->
  <path d="M 8 20 L 8 8 L 20 8" stroke="#F7AD3A" stroke-width="2" fill="none" />
  <path d="M 842 20 L 842 8 L 830 8" stroke="#00FFC4" stroke-width="2" fill="none" />
  <path d="M 8 120 L 8 132 L 20 132" stroke="#FE428E" stroke-width="2" fill="none" />
  <path d="M 842 120 L 842 132 L 830 132" stroke="#F7AD3A" stroke-width="2" fill="none" />

  <!-- Left Icon Emblem (Arcade Gamepad / Sword) -->
  <g transform="translate(36, 38)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <!-- Gamepad SVG -->
    <path d="M 18 36 C 18 27, 24 24, 32 24 C 40 24, 46 27, 46 36 C 46 41, 43 45, 38 45 C 36 45, 35 43, 32 43 C 29 43, 28 45, 26 45 C 21 45, 18 41, 18 36 Z" fill="none" stroke="#F7AD3A" stroke-width="2.2" stroke-linejoin="round" />
    <!-- D-Pad -->
    <path d="M 24 33 L 28 33 M 26 31 L 26 35" stroke="#00FFC4" stroke-width="2" stroke-linecap="round" />
    <!-- Buttons -->
    <circle cx="37" cy="34" r="1.5" fill="#FE428E" />
    <circle cx="40" cy="32" r="1.5" fill="#F7AD3A" />
  </g>

  <!-- Main Titles -->
  <g transform="translate(120, 0)">
    <text x="0" y="62" class="title">JONATHAN RIO W</text>
    <text x="0" y="90" class="subtitle">⚔️ FULL-STACK ARCHITECT &amp; MOBILE ENGINEER</text>
  </g>

  <!-- Level & Rank Badge (Right Side) -->
  <g transform="translate(680, 48)">
    <rect x="0" y="0" width="134" height="42" rx="8" fill="#161b22" stroke="#00FFC4" stroke-width="1.2" />
    <circle cx="16" cy="21" r="5" fill="#00FFC4" filter="url(#glow)" />
    <text x="28" y="19" class="badge-text" fill="#8b949e" font-size="9">PLAYER STATUS</text>
    <text x="28" y="32" class="badge-text">LVL 47+ ACTIVE</text>
  </g>
</svg>
