<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="100%" height="130" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="60%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 800;
      font-size: 30px;
      fill: url(#textGrad);
      letter-spacing: 1.5px;
    }
    .role-sub {
      font-family: "Fira Code", monospace, "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #00F0FF;
      letter-spacing: 1.2px;
    }
    .pill-label {
      font-family: "Fira Code", monospace, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #10B981;
    }
    .grid-mesh {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
  </style>

  <!-- Container Box with Rounded Bento Corners -->
  <rect x="2" y="2" width="846" height="126" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Background Subtle Grid Pattern -->
  <line x1="0" y1="32" x2="850" y2="32" class="grid-mesh" />
  <line x1="0" y1="65" x2="850" y2="65" class="grid-mesh" />
  <line x1="0" y1="98" x2="850" y2="98" class="grid-mesh" />
  <line x1="150" y1="0" x2="150" y2="130" class="grid-mesh" />
  <line x1="300" y1="0" x2="300" y2="130" class="grid-mesh" />
  <line x1="450" y1="0" x2="450" y2="130" class="grid-mesh" />
  <line x1="600" y1="0" x2="600" y2="130" class="grid-mesh" />
  <line x1="720" y1="0" x2="720" y2="130" class="grid-mesh" />

  <!-- Decorative Corner Tech Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#00F0FF" stroke-width="2" fill="none" />
  <path d="M 838 24 L 838 12 L 826 12" stroke="#10B981" stroke-width="2" fill="none" />
  <path d="M 12 106 L 12 118 L 24 118" stroke="#3B82F6" stroke-width="2" fill="none" />
  <path d="M 838 106 L 838 118 L 826 118" stroke="#00F0FF" stroke-width="2" fill="none" />

  <!-- Left Icon Emblem (Terminal / Code Matrix) -->
  <g transform="translate(32, 33)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="#141a29" stroke="#1e293b" stroke-width="1.5" />
    <!-- Terminal Prompt Shapes -->
    <path d="M 18 24 L 28 32 L 18 40" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="32" y1="40" x2="46" y2="40" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Identity Typography -->
  <g transform="translate(116, 0)">
    <text x="0" y="58" class="name-title">JONATHAN RIO W</text>
    <text x="0" y="86" class="role-sub">FULL-STACK ARCHITECT &amp; MOBILE ENGINEER</text>
  </g>

  <!-- Live Status Badge (Top Right Bento Pill) -->
  <g transform="translate(670, 44)">
    <rect x="0" y="0" width="146" height="42" rx="10" fill="#141a29" stroke="#10B981" stroke-width="1.2" />
    <circle cx="18" cy="21" r="5" fill="#10B981" filter="url(#softGlow)" />
    <text x="32" y="19" class="pill-label" fill="#94A3B8" font-size="9">EXPERIENCE</text>
    <text x="32" y="32" class="pill-label">47+ REPOSITORIES</text>
  </g>
</svg>
